[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# SPA fallback: redirect all unmatched routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Reference: Set these environment variables in Netlify UI (Site settings > Build & deploy > Environment)
# - VITE_API_BASE_URL
# - VITE_API_USER
# - VITE_API_URL
# For details, see README.md
